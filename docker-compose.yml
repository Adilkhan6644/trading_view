services:
  trading-alert-bot:
    build: .
    container_name: trading-alert-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Required in Docker so the dashboard is reachable from your browser
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
